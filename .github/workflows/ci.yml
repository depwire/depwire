name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }}${{ matrix.os == 'windows-latest' && ' (Windows)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --maxWorkers=2 --testTimeout=15000

      - name: Validate release metadata
        run: node scripts/validate-release-metadata.mjs

      - name: Smoke test packed CLI and MCP server
        run: node scripts/smoke-packed.mjs
